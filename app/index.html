    const R0 = chgRange(c);
    return `<div class="page brief-page">
      <div class="ph"><div><a href="#overview" class="ex-more" style="padding:0;margin-bottom:6px">← Back to Executive</a><h1>PDF preview</h1><p>This is what the brief for ${esc(c.cfg.name)}, ${esc(rangeText(c, R0))}, looks like when downloaded. To change the period, pick a different date range on the Executive page.</p></div></div>
      <div class="paper"><iframe title="Brief preview" scrolling="no" srcdoc="${esc(briefHtml(c, true))}"></iframe></div>
    </div>`;
  }

  /* ---------- Overview ---------- */
  function pageOverview(c) {
    const { R, O, cur, prev } = periods(c);
    const e = isEcom(c), Rn = Math.min(R, c.data.n);
    const d = t => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    // 1. How the business is doing
    // Each scorecard is also a chart selector: click one to plot that metric.
    const ratio = (a, b) => sl => sum(sl.map(a)) / Math.max(1e-9, sum(sl.map(b)));
    const MET = e ? {
      revenue: { label: 'Revenue', of: sl => sum(sl.map(x => x.revenue)) / sl.length, fmt: v => m(v, c), axis: v => v >= 1000 ? Math.round(v / 1000) + 'k' : Math.round(v) + '', total: w => w.revenue, tfmt: v => m(v, c), perDay: true },
      orders: { label: 'Orders', of: sl => sum(sl.map(x => x.conv)) / sl.length, fmt: v => v.toFixed(1), axis: v => Math.round(v) + '', total: w => w.conv, tfmt: n0, perDay: true },
      aov: { label: 'Average order value', of: ratio(x => x.revenue, x => x.conv), fmt: v => m(v, c), axis: v => Math.round(v) + '', total: w => w.revenue / w.conv, tfmt: v => m(v, c) },
      spend: { label: 'Ad spend', of: sl => sum(sl.map(x => x.spend)) / sl.length, fmt: v => m(v, c), axis: v => v >= 1000 ? Math.round(v / 1000) + 'k' : Math.round(v) + '', total: w => w.spend, tfmt: v => m(v, c), perDay: true, neutral: true },
    } : {
      leads: { label: 'Leads', of: sl => sum(sl.map(x => x.conv)) / sl.length, fmt: v => v.toFixed(1), axis: v => (Math.round(v * 10) / 10) + '', total: w => w.conv, tfmt: n0, perDay: true },
      meetings: { label: 'Booked meetings', of: sl => sum(sl.map(x => x.meetings)) / sl.length, fmt: v => v.toFixed(1), axis: v => (Math.round(v * 10) / 10) + '', total: w => w.meetings, tfmt: n0, perDay: true },
      spend: { label: 'Ad spend', of: sl => sum(sl.map(x => x.spend)) / sl.length, fmt: v => m(v, c), axis: v => Math.round(v) + '', total: w => w.spend, tfmt: v => m(v, c), perDay: true, neutral: true },
      cpl: { label: 'Cost per lead', of: ratio(x => x.spend, x => x.conv), fmt: v => m(v, c, 2), axis: v => m(v, c, 0), total: w => w.spend / w.conv, tfmt: v => m(v, c), invert: true },
    };
    const bm = MET[state.bizMetric] ? state.bizMetric : Object.keys(MET)[0];
    const mt = MET[bm];
    const s1 = series(c, mt.of, R, O), sp = prev ? series(c, mt.of, R, O + R) : null;
    const sers = [{ name: `${mt.label}${mt.perDay ? ' per day' : ''}${R > 7 ? ' (7-day average)' : ''}`, short: 'This period', color: 'var(--primary)', main: true, points: s1 }];
    if (sp) sers.push({ name: `Previous ${R} days`, short: 'Previous', color: 'var(--prev)', points: sp });
    // Actions that were implemented: verified, or adopted and being verified
    const done = ledgerRows(c).filter(r => ['verified', 'adopted', 'requested'].includes(r.status) && !(r.agent === 'connect' && r.status !== 'verified'));
    const asc = done.slice().sort((a, b) => a.at - b.at);
    const idxOf = t => Rn - 1 - Math.max(0, Math.round((GF.END - dayStart(t)) / GF.DAY));
    let k = 0;
    const inRange = asc.filter(r => idxOf(r.at) >= 0).map(r => ({ r, n: ++k, i: Math.min(Rn - 1, idxOf(r.at)) }));
    const numOf = new Map(inRange.map(x => [x.r.id, x.n]));
    const marks = inRange.map(x => ({ i: x.i, n: x.n, color: FOX[x.r.fox] ? FOX[x.r.fox].c : 'var(--muted)', title: `${x.n}. ${d(x.r.at)} · ${x.r.title}` }));
    const chart = lineChart(sers, { axis: mt.axis, fmt: mt.fmt, height: 320, marks });
    const kpis = Object.entries(MET).map(([key, x]) => `<button class="kpi kpibtn" data-act="bizm" data-k="${key}" aria-pressed="${key === bm}"><div class="label">${esc(x.label)} ${om('observed')}</div><div class="value">${x.tfmt(x.total(cur))}</div>${dpill(x.total(cur), prev && x.total(prev), x.invert, x.neutral)}</button>`).join('');
    const business = `<section class="sec" aria-label="How the business is doing">
        <div class="sec-head"><div class="lead"><span class="eyebrow">How the business is doing</span><span>${esc(rangeLabel(c))}. ${e ? `Revenue and orders from ${esc(c.cfg.orderSourceName || 'Shopify')}` : 'Leads from your forms and Calendly'}, spend from platform billing.</span></div><div class="filters">${rangeSeg()}</div></div>
        <div class="kpis" style="margin-bottom:22px">${kpis}</div>
        ${chart}
        ${marks.length ? `<p class="marknote">Numbered markers show when a fox’s action was put in place. Hover one to see which.</p>` : ''}
        <div class="callout"><b>What this does and doesn’t show.</b> ${e ? 'Revenue' : 'Lead volume'} moves for many reasons GrowthFox can’t see, such as ${e ? 'pricing, promotions, seasonality and email' : 'sales activity, events and seasonality'}. So we don’t claim the foxes caused the trend. What we do measure is each action’s own result, verified in the platform (below). Proving an effect on the whole business takes an experiment, such as a holdout.</div>
      </section>`;
    // 2. What the foxes have done
    const verified = done.filter(r => r.status === 'verified');
    const st = ledgerStats(c, ledgerRows(c));
    const items = done.map(r => {
      const n = numOf.get(r.id);
      const f = FOX[r.fox] || { name: 'GrowthFox', c: 'var(--muted)' };
      const res = r.status === 'verified' && r.unit !== 'none' ? `<span class="meas good">${esc(impactText(c, r.unit, r.measuredPerDay))}</span><small>measured ${om(r.unit === 'revenue' ? 'modeled' : 'observed')}</small>` : r.unit === 'none' ? '<span style="color:var(--faint)">—</span>' : `<span class="meas" style="color:var(--ink-2)">${esc(impactText(c, r.unit, r.expectedPerDay))}</span><small>expected</small>`;
      return `<li style="${foxVars(r.fox in FOX ? r.fox : 'paid')}"><span class="dn" style="background:${f.c};width:12px;height:12px;margin:6px 6px 0"></span>
        <div style="min-width:0"><b>${esc(r.title)}</b><div class="s"><span class="foxchip">${esc(f.name)}</span><span>${d(r.at)}</span>${STATUS_CHIP[r.status] ? STATUS_CHIP[r.status](r) : ''}</div></div>
        <div class="res">${res}</div></li>`;
    }).join('');
    const doneSec = `<section class="sec" aria-label="What your foxes have done">
        <details class="donebox" ${state.doneOpen ? 'open' : ''}><summary data-act="doneopen">
          <div class="lead"><span class="eyebrow">What your foxes have done</span><span><b>${done.length}</b> actions put in place · <b>${verified.length}</b> verified · decisioned spend <b>${m(st.decisioned, c)}/month</b></span></div>
          <span class="chev">${I.arrow}</span></summary>
          <ol class="donelist">${items || '<li class="empty">No actions put in place yet.</li>'}</ol>
          <a href="#ledger" class="area-link" style="padding-left:0;margin-top:10px">Full history in the ledger ${I.arrow}</a>
        </details>
      </section>`;
    // 3. The foxes, and what's next
    const cards = ['paid', 'analytics', 'engineer'].map(key => {
      const fm = metricFor(c, key);
      const sv = series(c, fm.of, R, O), spv = prev ? series(c, fm.of, R, O + R) : null;
      const v = fm.now ? fm.now() : fm.total(cur), pv = prev ? fm.total(prev) : null;
      return `<button class="foxcard" data-act="nextfox" data-k="${key}" aria-pressed="${state.nextFox === key}" style="${foxVars(key)}"><span class="who">${foxSvg(key)}<span><b>${FOX[key].name}</b><span>${esc(fm.label)}</span></span></span>
        <span class="v"><strong>${fm.fmt(v)}</strong>${dpill(fm.total(cur), pv, fm.invert)}</span>${spark(sv, spv, FOX[key].c)}</button>`;
    }).join('');
    const nf = state.nextFox && FOX[state.nextFox] ? state.nextFox : null;
    const acts = activeRecs(c).filter(r => !nf || r.fox === nf).slice(0, nf ? 5 : 3);
    // Source problems and warmup, as messages from the fox that owns them (no status strip on the Overview)
    const alerts = [];
    for (const s of c.cfg.sources.filter(x => x.status === 'degraded')) alerts.push({ fox: 'engineer', html: `<p><b style="font-weight:600">${esc(s.name)} is only partly arriving:</b> ${esc(s.issue || 'some events are missing')}${s.since != null ? ` since ${GF.dayLabel(s.since)}` : ''}, so spend on this platform isn’t fully tracked until it’s fixed.</p><div class="row"><span class="chip warn">${I.alert}Degraded</span><a class="pillbtn" href="#engineer">Open Engineer Fox →</a></div>` });
    for (const q of c.cfg.quarantine.filter(x => !c.qdec[x.id])) alerts.push({ fox: 'analytics', html: `<p><b style="font-weight:600">${esc(q.source)} data from ${GF.dayLabel(q.daysAgo)} is quarantined.</b> ${esc(q.what)} It’s held out of every number until you decide. ${esc(q.ask)}</p><div class="row"><span class="chip bad">${I.shield}Quarantined</span><button class="btn" data-act="q-include" data-id="${esc(q.id)}">It’s real, include it</button><button class="btn" data-act="q-exclude" data-id="${esc(q.id)}">Not real, keep it out</button></div>` });
    if (!c.model.warm) alerts.push({ fox: 'paid', html: `<p><b style="font-weight:600">Warming up: ${c.model.warmLeft} days left.</b> Trend recommendations start once there are 4 weeks of data. Spend-Watch and data checks already run.</p><div class="row"><span class="chip info">${I.clock}Warmup</span></div>` });
    const alertHtml = alerts.filter(a => !nf || a.fox === nf).map(a => `<div class="bub-row" style="${foxVars(a.fox)}">${nf ? '' : foxSvg(a.fox, true)}<div class="bubble"${nf ? ' style="border-radius:16px"' : ''}>${nf ? '' : `<span class="name">${FOX[a.fox].name}</span>`}${a.html}</div></div>`).join('');
    const next = acts.map(r => `<div class="bub-row" style="${foxVars(r.fox)}">${nf ? '' : foxSvg(r.fox, true)}<div class="bubble"${nf ? ' style="border-radius:16px"' : ''}>${nf ? '' : `<span class="name">${FOX[r.fox].name}</span>`}<p><b style="font-weight:600">${esc(r.title)}.</b> ${esc(r.means)}</p>
      <div class="row"><span class="impact ${r.confidence === 'investigate' ? 'inv' : ''}">${esc(shortImpact(c, r))}</span><a class="pillbtn" href="#recs" data-goto="${r.id}">Review →</a></div></div></div>`).join('');
    return `<div class="page">
      <div class="ph-tools"><a class="btn primary" href="#brief">${I.download}Download PDF</a>${datePicker(c)}</div>
      <section class="fox-hero" aria-label="Executive summary" style="${foxVars('executive')}"><div class="id">${foxSvg('executive', true)}<div><h1>Executive Fox</h1><div class="role">${esc(FOX.executive.role)}</div></div></div>
        <div><span class="eyebrow">Executive summary · ${esc(rangeText(c, chgRange(c)))}</span><p class="sum">${esc(execSummary(c))}</p></div></section>
      ${realNote(c)}
      ${execSections(c)}
      ${footnote()}</div>`;
  }

  /* ---------- All actions ---------- */
  function pageRecs(c) {
    const recs = c.model.recs.filter(r => !r.held && (!r.optional || promoted(c, r)));
    const heldRecs = c.model.recs.filter(r => r.held);
    const done = recs.filter(r => recState(c, r));
    const active = recs.filter(r => !recState(c, r));
    const counts = { all: active.length }; for (const r of active) counts[r.fox] = (counts[r.fox] || 0) + 1;
    let list = active.filter(r => state.recFilter === 'all' || r.fox === state.recFilter);
    if (state.recSort === 'effort') list = [...list].sort((a, b) => (a.minutes || 999) - (b.minutes || 999));
    const filters = [['all', 'All'], ['paid', 'Paid Media'], ['analytics', 'Data'], ['engineer', 'Engineer']]
      .map(([k, l]) => `<button class="fbtn" data-act="filter" data-f="${k}" aria-pressed="${state.recFilter === k}">${l}<span class="n">${counts[k] || 0}</span></button>`).join('');
    const held = c.model.held.map(h => heldCard(c, h)).join('') + heldRecs.map(r => `<div class="held">${I.clock}<div><h4>On hold: ${esc(r.title)}</h4><p>${esc(r.held.text)}</p></div></div>`).join('');
    return `<div class="page">
      <div class="ph"><div><h1>All actions</h1><p>Every open action from your three foxes: ${active.length} open. Data fixes come first, because every other number depends on them; the rest are ranked by expected impact × confidence ÷ effort. You make every change; we verify it afterwards.</p></div>
        <a class="btn" href="#ledger">${I.history}Recommendation ledger (${ledgerRows(c).length})</a></div>
      ${held ? `<div style="display:grid;gap:10px">${held}</div>` : ''}
      <div class="filters" role="group" aria-label="Filter by fox">${filters}<span style="flex:1"></span><label for="sort" style="color:var(--muted);font-size:14px">Sort</label><select id="sort" class="select"><option value="value" ${state.recSort === 'value' ? 'selected' : ''}>Ranked (data fixes first)</option><option value="effort" ${state.recSort === 'effort' ? 'selected' : ''}>Quickest first</option></select></div>
      <div class="recs">${list.map((r, i) => recCard(c, r, i === 0 && state.recFilter === 'all')).join('') || `<div class="empty">No open actions from this fox.</div>`}</div>
      ${footnote()}</div>`;
  }

  /* ---------- Recommendation ledger ---------- */
  // Every action someone acted on (shared store) plus the sample client's earlier history.
  function ledgerRows(c) {
    const now = Date.now();
    const hist = (c.cfg.history || []).map(h => Object.assign({}, h, {
      id: 'hist-' + h.id, sample: true, at: now - h.daysAgo * GF.DAY,
      verifiedAt: h.verifiedDaysAgo != null ? now - h.verifiedDaysAgo * GF.DAY : null,
    }));
    const live = Object.entries(c.status).filter(([, s]) => s && s.title && s.status !== 'promoted').map(([id, s]) => Object.assign({ id }, s));
    return live.concat(hist).sort((a, b) => b.at - a.at);
  }
  /* ---------- Changes you logged ----------
     Things that move results that the foxes can't see (a promotion, a launch, a price change). They sit on the
     same timeline as the foxes' actions, as context: shown next to the results, never credited with them. */
  const CH_CAT = { promo: 'Promotion or discount', price: 'Price change', launch: 'Launch', site: 'Website or app change', stock: 'Stock-out', pr: 'PR or press', offline: 'Offline campaign', other: 'Other' };
  const CH_AFFECTS = ['Google Ads', 'Meta', 'Email', 'Website', 'App', 'Offline'];
  const SAMPLE_CHANGES = {
    nordlys: [{ daysAgo: 19, cat: 'launch', title: 'New winter blend launched', ch: '' }, { daysAgo: 9, cat: 'promo', title: '20% off all beans for a long weekend', ch: '' }, { daysAgo: 3, cat: 'stock', title: 'Best-selling espresso blend sold out', ch: 'Website' }],
    flamehouse: [{ daysAgo: 20, cat: 'launch', title: 'Plant-based burger added to the menu', ch: '' }, { daysAgo: 11, cat: 'promo', title: '2-for-1 burgers on Tuesdays in the app', ch: 'App' }, { daysAgo: 4, cat: 'offline', title: 'Local radio campaign in three cities', ch: 'Offline' }],
  };
  function changeRows(c) {
    const samples = (SAMPLE_CHANGES[c.cfg.id] || []).map((s, i) => Object.assign({ id: 'sample-ch-' + i, sample: true, at: GF.END - s.daysAgo * GF.DAY + 12 * 3600e3 }, s));
    const mine = Object.entries(chg(c.cfg.id)).filter(([, v]) => v && v.title).map(([id, v]) => Object.assign({ id }, v));
    return mine.concat(samples).sort((a, b) => b.at - a.at);
  }
  const isoDay = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  function changeForm() {
    if (ledgerMode === 'readonly') return '<p class="sub">You can view these changes, but not add to them.</p>';
    const dr = state.chDraft || {};
    return `<form class="chform" data-form="change" aria-label="Log a change">
      <label>Date<input type="date" name="date" required max="${isoDay(GF.END + GF.DAY)}" value="${esc(dr.date || isoDay(GF.END))}"></label>
      <label>Kind<select name="cat" class="select">${Object.entries(CH_CAT).map(([k, l]) => `<option value="${k}" ${dr.cat === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="grow">What changed<input name="title" required maxlength="90" placeholder="e.g. 20% off sitewide for Black Friday" value="${esc(dr.title || '')}"></label>
      <label>Affects<select name="ch" class="select"><option value="">The whole business</option>${CH_AFFECTS.map(a => `<option ${dr.ch === a ? 'selected' : ''}>${a}</option>`).join('')}</select></label>
      <button class="btn primary" type="submit">Log change</button></form>`;
  }
  function ledgerStats(c, rows) {
    const verified = rows.filter(r => r.status === 'verified');
    const adoptedAll = rows.filter(r => ['adopted', 'requested', 'verified', 'not_verified'].includes(r.status));
    const decided = rows.filter(r => !['snoozed', 'expected', 'closed'].includes(r.status));
    const checked = rows.filter(r => r.status === 'verified' || r.status === 'not_verified');
    const money = verified.filter(r => (r.unit === 'saved' || r.unit === 'revenue') && !r.bet);
    const judged = verified.filter(r => r.unit !== 'none' && r.expectedPerDay), passed = judged.filter(r => r.bet ? r.successCheck !== 'failed' : r.measuredPerDay >= 0.85 * r.expectedPerDay).length;
    const exp = money.reduce((s, r) => s + (r.expectedPerDay || 0), 0), meas = money.reduce((s, r) => s + (r.measuredPerDay || 0), 0);
    return {
      decisioned: verified.reduce((s, r) => s + (r.spendChangedPerDay || 0), 0) * 30,
      adoption: decided.length ? adoptedAll.length / decided.length : null,
      verifiedShare: checked.length ? verified.length / checked.length : null,
      hitRate: exp ? meas / exp : null, passed, judgedN: judged.length,
      verified: verified.length, adopted: adoptedAll.length, decidedN: decided.length, checkedN: checked.length,
      pending: rows.filter(r => r.status === 'adopted' || r.status === 'requested').length,
    };
  }
  const STATUS_CHIP = {
    verified: s => `<span class="chip good">${I.check}Verified</span>`,
    not_verified: s => `<span class="chip warn">${I.alert}Not verified</span>`,
    adopted: s => `<span class="chip info">${I.clock}Adopted · verifying</span>`,
    requested: s => `<span class="chip info">${I.team}With our team</span>`,
    snoozed: s => `<span class="chip neutral">${I.clock}Snoozed</span>`,
    expected: s => `<span class="chip neutral">${I.target}Expected level</span>`,
    closed: s => `<span class="chip neutral">${I.check}Closed as expected</span>`,
    dismissed: s => `<span class="chip neutral">${I.x}Dismissed</span>`,
  };
  function pageLedger(c) {
    const rows = ledgerRows(c), st = ledgerStats(c, rows);
    const d = t => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    const pct = v => v == null ? '—' : Math.round(v * 100) + '%';
    const readonly = ledgerMode === 'readonly';
    const body = rows.map(r => {
      const live = !r.sample;
      const due = r.verifyDue;
      let verif = '';
      if (r.status === 'verified') verif = `Verified ${d(r.verifiedAt)}${r.note ? `<small>${esc(r.note)}</small>` : ''}`;
      else if (r.status === 'not_verified') verif = `Checked ${d(r.verifiedAt || r.at)}${r.note ? `<small>${esc(r.note)}</small>` : ''}`;
      else if (r.status === 'adopted' || r.status === 'requested') verif = `Due ${d(due)}<small>${r.agent === 'volume' || r.agent === 'gap' ? 'Our team reports back' : r.agent === 'connect' ? 'When the source starts syncing' : (r.agent === 'tracking' || r.agent === 'engineer') ? 'When the check passes on the daily run' : `Against the ${esc(GF.PLATFORMS[r.platform] || r.platform)} change history`}</small>`;
      else if (r.status === 'dismissed') verif = `<small style="margin:0">Reason: ${esc(r.reason || '—')}</small>`;
      else if (r.status === 'snoozed') verif = `<small style="margin:0">Back ${d(r.until)}</small>`;
      else if (r.status === 'closed') verif = `Closed ${d(r.at)}<small>${esc(r.reason || '')}${r.logged ? ' · logged as your change' : ''}</small>`;
      else if (r.status === 'expected') verif = `<small style="margin:0">Baseline ${(r.baseline * 100).toFixed(1)}% · flagged again only below it</small>`;
      const measured = r.bet && r.status === 'verified' ? `<span class="meas ${r.successCheck === 'failed' ? 'low' : 'good'}">${checkText(r)}</span><small>success check</small>` : r.status === 'verified' && r.unit !== 'none'
        ? `<span class="meas ${r.measuredPerDay >= 0.85 * r.expectedPerDay ? 'good' : 'low'}">${esc(impactText(c, r.unit, r.measuredPerDay))}</span> ${om(r.unit === 'revenue' ? 'modeled' : 'observed')}`
        : '<span style="color:var(--faint)">—</span>';
      const acts = !live || readonly ? '' : (r.status === 'adopted' || r.status === 'requested')
        ? `${c.cfg.real ? '' : `<button class="btn" data-act="verify" data-id="${esc(r.id)}" title="Sample data: runs the verification check now instead of waiting ${r.verifyDays || 7} days">Run verification (demo)</button>`}<button class="btn ghost" data-act="undo" data-id="${esc(r.id)}">Undo</button>`
        : r.status === 'verified' || r.status === 'not_verified' ? '' : `<button class="btn ghost" data-act="undo" data-id="${esc(r.id)}">Reopen</button>`;
      return `<tr style="${foxVars(r.fox)}">
        <td style="white-space:nowrap">${d(r.at)}</td>
        <td class="act"><b><span class="foxdot"></span>${esc(r.title)}</b><small>${esc(FOX[r.fox].name)} · ${esc(AGENT[r.agent] || '')} · ${esc(r.owner || 'You')}${r.sample ? ' · earlier history' : ''}</small>${r.success ? `<small>${I.target.replace('<svg', '<svg width="12" height="12" style="vertical-align:-1px;margin-right:4px"')}${esc(r.success)}</small>` : ''}</td>
        <td class="act ver">${STATUS_CHIP[r.status] ? STATUS_CHIP[r.status](r) : esc(r.status)}<small style="margin-top:6px">${verif}</small>${acts ? `<div class="row-actions" style="justify-content:flex-start;margin-top:8px">${acts}</div>` : ''}</td>
        <td class="r" style="white-space:nowrap">${r.unit === 'none' ? '—' : r.bet ? `${esc(betRange(c, r))}/day<small>estimate</small>` : esc(impactText(c, r.unit, r.expectedPerDay))}</td>
        <td class="r" style="white-space:nowrap">${measured}</td></tr>`;
    }).join('');

    const TOP = 10;
    // Sort: by points, or critical first (then warning, setup checks, optional), each group by points.
    const dataSort = state.dataSort || store.get('dataSort', 'points');
    const SEV = { critical: 0, warning: 1, optional: 3 }, sev = r => r.param ? SEV[r.cat] : 2;
    const dataAll = acts.slice().sort((x, y) => (dataSort === 'critical' ? sev(x.r) - sev(y.r) : 0) || (y.r.dq || 0) - (x.r.dq || 0));
    const dataActs = state.dataMore ? dataAll : dataAll.slice(0, TOP);
    const stat = r => r.param ? `<span>${pct1(r.present)} present${r.valid ? ` · ${pct1(1 - r.invalid)} valid` : ''}</span>` : '';
    const more = (n, on, act) => n > TOP ? `<button class="btn ghost morebtn" data-act="${act}" aria-expanded="${!!on}">${on ? 'Show fewer' : `Show ${n - TOP} more`}</button>` : '';
    const offTbl = dataActs.length ? `<ol class="actlist">${dataActs.map((a, i) => `<li><span class="rank">${i + 1}</span><div style="min-width:0"><a class="t" href="#action/${encodeURIComponent(a.r.id)}">${esc(a.r.title)}</a><div class="s">${a.r.param ? `<span class="catchip ${a.r.cat}">${CAT[a.r.cat].name}</span><span><code>${esc(a.r.param)}</code></span>` : `<span class="catchip setup">Setup check</span>`}<span>${esc(GF.PLATFORMS[a.r.platform] || '')}</span>${stat(a.r)}${a.r.optional ? `<span>Added by you · <button type="button" class="linkbtn" data-act="unpromote" data-id="${esc(a.r.id)}">Remove</button></span>` : ''}</div></div><div class="imp">${esc(a.imp)}<small>${esc(a.sub)}</small></div></li>`).join('')}</ol>${more(dataAll.length, state.dataMore, 'datamore')}` : '<div class="empty">Nothing to fix. Every critical and warning parameter is complete and valid.</div>';
    // 2. Optional improvements: listed here only. "Add to actions" moves one into Data fixes and All actions.
    const optAll = c.model.recs.filter(r => r.optional && !c.status[r.id]).sort((x, y) => y.dq - x.dq);
    const optional = state.optMore ? optAll : optAll.slice(0, TOP);
    const optList = optional.length ? `<ol class="actlist">${optional.map((r, i) => `<li><span class="rank">${i + 1}</span><div style="min-width:0"><a class="t" href="#action/${encodeURIComponent(r.id)}">${esc(r.title)}</a><div class="s"><span class="catchip optional">Optional</span><span><code>${esc(r.param)}</code></span><span>${esc(GF.PLATFORMS[r.platform] || '')}</span>${stat(r)}</div></div><div class="imp opt-imp"><span>+${ptsTxt(r.dq / rows.length)} pts<small>+${ptsTxt(r.dq)} on ${esc(GF.PLATFORMS[r.platform] || '')}</small></span>${ledgerMode === 'readonly' ? '' : `<button class="btn" data-act="promote" data-id="${esc(r.id)}">Add to actions</button>`}</div></li>`).join('')}</ol>${more(optAll.length, state.optMore, 'optmore')}` : '<div class="empty">Every optional parameter is complete.</div>';
    const userExp = Object.entries(c.status).filter(([id, v]) => v && v.status === 'expected' && id.startsWith('dq-'));
    const atExp = [];
    // 3. Expected levels: known in advance (sample) or marked by you. Below its baseline, a parameter becomes an action again.
    for (const { ep, w } of rows) for (const p of ep.params) if (p.exp && w.comp[p.key] >= p.exp - 0.005) atExp.push({ ep, p, comp: w.comp[p.key], base: p.exp, why: p.expWhy, sample: true });
    for (const [id, v] of userExp) { const r = rows.find(x => id.startsWith(`dq-${x.ep.id}-`)); if (!r) continue; const key = id.slice(`dq-${r.ep.id}-`.length), p = r.ep.params.find(x => x.key === key); if (p) atExp.push({ ep: r.ep, p, comp: r.w.comp[key], base: v.baseline, why: `Marked by you on ${new Date(v.at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}.`, id }); }
    const expList = atExp.length ? `<div class="tbl-wrap"><table class="ltbl"><thead><tr><th>Parameter</th><th>Category</th><th class="r">Expected level</th><th class="r">Last 7 days</th><th>Why</th><th class="r"></th></tr></thead><tbody>${atExp.map(x => { const below = x.comp < x.base - 0.005; return `<tr><td><code>${esc(x.p.key)}</code><small class="pdesc">${esc(x.ep.name)}</small></td><td><span class="catchip ${x.p.cat}">${CAT[x.p.cat].name}</span></td><td class="r">${pct1(x.base)}</td><td class="r" style="color:${below ? 'var(--bad)' : 'var(--good)'};font-weight:600">${pct1(x.comp)}${below ? '<small>below: back in actions</small>' : ''}</td><td style="color:var(--ink-2)">${esc(x.why || '')}</td><td class="r">${x.id && ledgerMode !== 'readonly' ? `<button class="btn ghost" data-act="undo" data-id="${esc(x.id)}">Remove</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div>` : '';

    const actList = acts.length ? `<ol class="actlist">${acts.map((a, i) => `<li><span class="rank">${i + 1}</span><div style="min-width:0"><a class="t" href="#action/${encodeURIComponent(a.r.id)}">${esc(a.r.title)}</a><div class="s"><span>${esc(GF.PLATFORMS[a.r.platform] || '')}</span>${a.r.minutes ? `<span>~${a.r.minutes} min</span>` : ''}${confBadge(a.r)}</div></div><div class="imp ${a.score <= 0 ? 'inv' : ''}">${esc(a.imp)}<small>${esc(a.sub)}</small></div></li>`).join('')}</ol>` : '<div class="empty">No open actions.</div>';

    return `<div class="page" style="${foxVars('analytics')}">
      <section class="fox-hero" aria-label="Executive summary"><div class="id">${foxSvg('analytics', true)}<div><h1>${f.name}</h1><div class="role">${esc(f.role)}</div></div></div>
        <div><span class="eyebrow">Executive summary · today</span><p class="sum">${esc(summary)}</p></div></section>
      ${statusStrip(c)}
      ${(() => { const held = c.model.held.map(h => heldCard(c, h)).join(''); return held ? `<div style="display:grid;gap:10px">${held}</div>` : ''; })()}
      <section class="sec" aria-label="Data quality by endpoint">
        <div class="sec-head">${rangeSeg()}</div>
        <div class="dqhero">${dqGauge(overall)}
          <div class="dqhero-r">
            <div class="dqhero-top"><div><span class="eyebrow">Overall data quality</span><div class="dqhero-st" style="color:${ST_COL[GF.epStatus(overall)]}">${ST_TXT[GF.epStatus(overall)]}</div></div>${deltaPts(overall, prevOverall)}</div>
            ${dqBreakdown(rows)}
            <small class="dqhero-note">Average of ${rows.length} endpoint scores. Each parameter counts by its category: critical 60, warning 30, optional 10 points.</small>
          </div>
        ${(() => { // the overall score, day by day over the picked range (7-day average for longer ranges)
          const { R: Rr, O } = periods(c), of = sl => sum(sl.map(x => x.dq)) / sl.length;
          const cur = series(c, of, Rr, O), prev = c.data.n >= O + 2 * Rr ? series(c, of, Rr, O + Rr) : null;
          if (!cur || cur.length < 2) return '';
          const sers = [{ name: `Data quality score${Rr > 7 ? ' (7-day average)' : ''}`, short: 'Score', color: 'var(--ana)', main: true, points: cur }];
          if (prev) sers.push({ name: 'Period before', short: 'Before', color: 'var(--prev)', points: prev });
          return `<div class="dq-trend"><span class="eyebrow">Score over time</span>${lineChart(sers, { axis: v => (Math.round(v * 10) / 10) + '', fmt: v => v.toFixed(1), height: 210, minSpan: 6, width: 520 })}</div>`;
        })()}
        </div>
        <div class="epgrid">${cards}</div>
      </section>
      <section class="sec"><div class="sec-head"><div class="lead"><span class="eyebrow">Data fixes</span><span>${dataAll.length} open, also in All actions, ${dataSort === 'critical' ? 'critical first, then by the score points each fix wins back' : 'ranked by the score points each fix wins back'}.</span></div><div class="filters"><div class="seg" role="group" aria-label="Sort data fixes"><button data-act="datasort" data-k="points" aria-pressed="${dataSort === 'points'}">Most points</button><button data-act="datasort" data-k="critical" aria-pressed="${dataSort === 'critical'}">Critical first</button></div></div></div>
        ${offTbl}</section>
      <section class="sec"><div class="sec-head"><div class="lead"><span class="eyebrow">Optional improvements</span><span>Optional parameters below 100%. Nice to have for matching and reporting, so they stay here. Add one to actions if you want to work on it.</span></div></div>${optList}</section>
      ${expList ? `<section class="sec"><div class="sec-head"><div class="lead"><span class="eyebrow">At expected level</span><span>Parameters that can never reach 100% for good reasons. Their level is the baseline: if one drops below it, it becomes an action again.</span></div></div>${expList}</section>` : ''}
      ${footnote()}</div>`;
  }
  // Setup checks and sources (formerly the Tracking health page). Tag and connection checks belong to the Engineer Fox.
  function dataChecks(c) {
    const groups = {};
    for (const ch of c.cfg.checks.filter(x => x.group !== 'tags')) (groups[ch.group] = groups[ch.group] || []).push(ch);
    const icon = s => `<span class="ico ${s}">${s === 'pass' ? I.check : s === 'warn' ? I.alert : I.x}</span>`;
    const checks = Object.entries(groups).map(([g, list]) => `<div class="check-group"><h4>${esc(GF.CHECK_GROUPS[g])}</h4>${list.map(ch => `<div class="check">${icon(ch.status)}<b style="font-weight:500">${esc(GF.PLATFORMS[ch.platform])}</b><div class="v">${esc(GF.fillDates(ch.value))} <span class="tgt">· target: ${esc(ch.target)}</span>${ch.explain ? `<small>${esc(ch.explain)}</small>` : ''}${ch.fix ? `<small><a href="#recs" data-goto="tr-${ch.group}-${ch.platform}">${esc(ch.fix.title)} →</a></small>` : ''}</div></div>`).join('')}</div>`).join('');
    return `<section class="sec" id="checks"><div class="sec-head"><div class="lead"><span class="eyebrow">Setup checks</span><span>Run daily on every source. Data that fails a check is flagged and explained, never silently dropped; recommendations built on it are held back. Each failing check links to its fix.</span></div></div>${checks}</section>`;
  }

  /* ---------- Parameter detail: one parameter on one endpoint ----------
     1) Its row from the endpoint table, column by column. 2) A preview of the 20 most recent events in the
     picked date range that are missing it or carry an invalid value. Sample events, generated, not a real client's. */
  function pageParam(c, prm) {
    const { R } = periods(c), O = periods(c).O, rows = epRows(c, R);
    const row = prm && rows.find(r => r.ep.id === prm.ep), p = row && row.ep.params.find(x => x.key === prm.key);
    if (!row || !p) return `<div class="page"><a href="#analytics">← Data Fox</a><div class="empty">Parameter not found.</div></div>`;
    const { ep, w } = row;
    const v = w.comp[p.key], inv = p.inv || 0, pres = Math.min(1, v / (1 - inv)), vr = GF.validRule(p.key);
    const baseN = ep.evShare ? w.events * (ep.evShare[p.ev] || 0) : w.events, failN = Math.round(baseN * (1 - v));
    const missN = Math.round(baseN * (1 - pres)), invN = Math.max(0, failN - missN);
    const rid = `dq-${ep.id}-${p.key}`, rec = c.model.recs.find(r => r.id === rid), st = c.status[rid];
    const status = p.exp && v >= p.exp - 0.005 ? `<span class="chip neutral">${I.target}At expected level · ${pct1(p.exp)}</span><small>${esc(p.expWhy || '')}</small>`
      : st && st.status === 'expected' && rec && recState(c, rec) ? `<span class="chip neutral">${I.target}Expected level · ${pct1(st.baseline)}</span><small>Set by you</small>`
      : rec && !recState(c, rec) ? `<a class="chip ${p.cat === 'critical' ? 'bad' : p.cat === 'warning' ? 'warn' : 'neutral'}" href="#action/${encodeURIComponent(rid)}">${rec.optional && !promoted(c, rec) ? 'Optional improvement' : 'Open action'} →</a><small>${esc(rec.title)}</small>`
      : v >= 0.9995 ? `<span class="chip good">${I.check}Complete</span><small>Nothing to fix</small>` : '<span class="chip neutral">No action</span>';
    const kpis = `<div class="kpis pkpis">
      <div class="kpi"><div class="label">Present</div><div class="value">${pct1(pres)}</div><small>${n0(baseN * pres)} of ${n0(baseN)} ${esc(p.ev ? p.ev + ' events' : ep.unit)} carry it · ${n0(missN)} without it</small></div>
      <div class="kpi"><div class="label">Valid</div><div class="value" style="color:${vr ? (inv ? 'var(--bad)' : 'var(--good)') : 'var(--faint)'}">${vr ? pct1(1 - inv) : '—'}</div><small>${vr ? `Value check: ${esc(vr)}${p.bad ? ` · e.g. ${p.bad.map(b => '“' + esc(b) + '”').join(', ')}` : ''}${inv ? ` · ${n0(invN)} invalid` : ''}` : 'No value check: presence only'}</small></div>
      <div class="kpi"><div class="label">Complete and valid</div><div class="value" style="color:${compCol(v)}">${pct1(v)}</div><span class="meter"><i style="width:${(v * 100).toFixed(1)}%;background:${compCol(v)}"></i></span><small>${n0(failN)} failing events ${esc(perTxt(c))}</small></div>
      <div class="kpi"><div class="label">What it’s for</div><div style="font-size:15px;color:var(--fg)">${esc(p.desc)}</div><small>${CAT[p.cat].name}: ${esc(CAT[p.cat].why)}</small></div>
      <div class="kpi"><div class="label">Status</div><div style="display:grid;gap:6px;justify-items:start">${status}</div></div>
    </div>`;
    // Daily share complete and valid, over the picked range
    const e = c.data.eps.find(x => x.ep.id === ep.id), n = c.data.n, Rn = Math.min(R, n), from = n - O - Rn;
    const pts = e.days.slice(from, n - O).map((x, i) => ({ d: c.data.days[from + i].date, v: x.comp[p.key] * 100 }));
    const chart = pts.length > 1 ? lineChart([{ name: 'Complete and valid, per day', short: 'Complete and valid', color: 'var(--ana)', main: true, points: pts }], { axis: k => (Number.isInteger(k) ? k : k.toFixed(1)) + '%', fmt: k => k.toFixed(1) + '%', height: 220, minSpan: 2 }) : '';
    // Preview: the 20 most recent failing events in the range (deterministic sample)
    let seed = [...(c.cfg.id + ep.id + p.key)].reduce((h, ch) => (h * 31 + ch.charCodeAt(0)) >>> 0, 7);
    const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    const pick = a => a[Math.floor(rnd() * a.length)];
    const hex = k => Array.from({ length: k }, () => '0123456789abcdef'[Math.floor(rnd() * 16)]).join('');
    const PATHS = c.cfg.id === 'flamehouse' ? ['/order', '/menu/burgers', '/menu/sides', '/checkout', '/app/order'] : ['/espresso-machines', '/coffee-beans/winter-blend', '/coffee-beans', '/cart', '/checkout'];
    const invShare = failN ? invN / failN : 0, out = [];
    for (let i = n - O - 1; i >= from && out.length < 20; i--) {
      const x = e.days[i], perDay = (ep.evShare ? x.events * (ep.evShare[p.ev] || 0) : x.events) * (1 - x.comp[p.key]);
      const k = Math.min(20 - out.length, Math.max(perDay > 0.3 ? 1 : 0, Math.round(perDay)));
      const times = Array.from({ length: k }, () => Math.floor(rnd() * 86400)).sort((a, b) => b - a);
      for (const t of times) {
        const invalid = p.bad && rnd() < invShare;
        const evName = ep.id === 'meta' ? pick(['Purchase', 'Purchase', 'InitiateCheckout', 'AddToCart', 'ViewContent']) : ep.id === 'gads' ? 'Purchase (website)' : ep.evShare ? p.ev : 'order';
        const id = ep.id === 'meta' ? `evt_${hex(10)}` : ep.id === 'ga4' ? (p.ev === 'purchase' ? `T-${100000 + Math.floor(rnd() * 90000)}` : `GA1.1.${Math.floor(rnd() * 1e9)}`) : `#${10000 + Math.floor(rnd() * 90000)}`;
        const src = ep.id === 'meta' ? pick(['Conversions API', 'Conversions API', 'Browser pixel']) : ep.id === 'gads' ? 'Enhanced conversions' : ep.id === 'ga4' ? pick(PATHS) : pick(c.cfg.id === 'flamehouse' ? ['App', 'App', 'Web'] : ['Online store']);
        out.push({ at: c.data.days[i].t + t * 1000, evName, id, src, invalid, val: invalid ? pick(p.bad) : null });
      }
    }
    const fmtAt = t => new Date(t).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    const srcLabel = ep.id === 'ga4' ? 'Page' : ep.id === 'meta' ? 'Sent by' : ep.id === 'gads' ? 'Sent by' : 'Channel';
    const preview = out.length ? `<div class="tbl-wrap"><table class="ltbl"><thead><tr><th>Time</th><th>Event</th><th>ID</th><th>${srcLabel}</th><th>${esc(p.key)}</th><th>Issue</th></tr></thead><tbody>${out.map(r => `<tr>
        <td style="white-space:nowrap">${fmtAt(r.at)}</td><td><code>${esc(r.evName)}</code></td><td><code>${esc(r.id)}</code></td><td style="color:var(--ink-2)">${esc(r.src)}</td>
        <td>${r.invalid ? `<code style="color:var(--bad)">${esc(r.val)}</code>` : '<span style="color:var(--faint)">not sent</span>'}</td>
        <td>${r.invalid ? `<span class="catchip critical">Invalid</span><small>Fails: ${esc(vr)}</small>` : '<span class="catchip warning">Missing</span>'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No failing events in this period.</div>';
    return `<div class="page" style="${foxVars('analytics')}">
      <a href="#analytics/${ep.id}" data-act="back" style="font-size:15px;font-weight:500;text-decoration:none">← ${esc(ep.name)}</a>
      <div class="ph"><div><h1 style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:30px;letter-spacing:-0.01em">${esc(p.key)}</h1><p>${esc(ep.name)} · ${esc(ep.kind)}${p.ev ? ` · on <code>${esc(p.ev)}</code> events` : ''} · <span class="catchip ${p.cat}">${CAT[p.cat].name}</span></p></div><span class="aside">${asOf()}</span></div>
      <div class="filters" style="justify-content:flex-end">${rangeSeg()}</div>
      ${kpis}
      ${chart ? `<section class="sec"><div class="sec-head"><div class="lead"><span class="eyebrow">Complete and valid over time</span><span>Share of ${esc(p.ev ? p.ev + ' events' : ep.unit)} carrying a valid ${esc(p.key)}, per day.</span></div></div>${chart}</section>` : ''}
      <section class="sec"><div class="sec-head"><div class="lead"><span class="eyebrow">Failing events</span><span>The ${Math.min(20, out.length)} most recent of ${n0(failN)} ${esc(p.ev ? p.ev + ' events' : ep.unit)} in ${esc(perTxt(c))} that are missing ${esc(p.key)}${vr && inv ? ' or carry an invalid value' : ''}. Sample data.</span></div></div>${preview}</section>
      ${footnote()}</div>`;
  }

  function pageEndpoint(c, id) {
    const { R } = periods(c);
    const rows = epRows(c, R);
    const row = rows.find(r => r.ep.id === id);
    if (!row) return `<div class="page"><a href="#analytics">← Data Fox</a><div class="empty">Endpoint not found.</div></div>`;
    const { ep, w, p } = row, st = GF.epStatus(w.score);
    const Rn = Math.min(R, c.data.n);
    const tabs = rows.map(r => `<a class="fbtn" href="#analytics/${r.ep.id}" aria-pressed="${r.ep.id === id}">${esc(r.ep.name)}<span class="n" style="color:${r.ep.id === id ? '' : ST_COL[GF.epStatus(r.w.score)]}">${Math.round(r.w.score)}</span></a>`).join('');
    const trend = GF.epTrend(c.data, id, Rn, periods(c).O);
    const chart = lineChart(GF.CATS.map((k, i) => ({ name: `${CAT[k].name} values missing`, short: CAT[k].name, color: CAT[k].col, main: i === 0, solid: i > 0, points: trend.map(x => ({ d: x.d, v: x[k] })) })), { axis: v => (Number.isInteger(v) ? v : v.toFixed(1)) + '%', fmt: v => v.toFixed(1) + '%', height: 260 });
    const kpis = `<div class="kpis">
      <div class="kpi"><div class="label">Data quality score</div><div class="value" style="color:${ST_COL[st]}">${Math.round(w.score)}<span style="font-size:15px;color:var(--muted);font-weight:500">/100</span></div>${deltaPts(w.score, p && p.score)}</div>
      <div class="kpi"><div class="label">${esc(ep.unit[0].toUpperCase() + ep.unit.slice(1))} ${om('observed')}</div><div class="value">${n0(w.events)}</div><small>${perCap(c)}</small></div>
      <div class="kpi"><div class="label">Failed ${esc(ep.unit)}</div><div class="value" style="color:${w.failed / w.events > 0.05 ? 'var(--bad)' : 'var(--fg)'}">${n0(w.failed)}</div><small>${(w.failed / w.events * 100).toFixed(1)}% missing a critical parameter</small></div>
      <div class="kpi"><div class="label">Completeness by category</div>${GF.CATS.map(k => `<div class="catrow"><span><i style="background:${CAT[k].col}"></i>${CAT[k].name}</span><b style="color:${compCol(w.cats[k])}">${pct1(w.cats[k])}</b></div>`).join('')}</div>
    </div>`;
    const day = d => new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    // Clicking an event scorecard filters "Parameters by category" to that event's parameters.
    const evSel = ep.events && state.evSel && state.evSel.ep === id && ep.params.some(x => x.ev === state.evSel.ev) ? state.evSel.ev : null;
    const tables = GF.CATS.map(k => {
      const ps = ep.params.filter(x => x.cat === k && (!evSel || x.ev === evSel)).sort((a, b) => w.comp[a.key] - w.comp[b.key]);
      if (!ps.length) return '';
      return `<div class="cattbl"><div class="cathead ${k}"><b>${CAT[k].name}</b><span>${ps.length} parameter${ps.length > 1 ? 's' : ''} · weight ${GF.CAT_W[k] * 100}% · ${esc(CAT[k].why)}</span></div>
        <div class="tbl-wrap" style="margin-top:0"><table><thead><tr><th>Parameter</th><th class="r">Present</th><th class="r">Valid</th><th style="min-width:160px">Complete and valid</th><th>What it’s for</th></tr></thead><tbody>${ps.map(x => {
          const v = w.comp[x.key], baseN = ep.evShare ? w.events * (ep.evShare[x.ev] || 0) : w.events, vr = GF.validRule(x.key), pres = Math.min(1, v / (1 - (x.inv || 0)));
          const rid = `dq-${ep.id}-${x.key}`, st = c.status[rid], rec = c.model.recs.find(r => r.id === rid);
          const tag = x.exp && v >= x.exp - 0.005 ? `<small class="pdesc">Expected level ${pct1(x.exp)}</small>` : st && st.status === 'expected' && rec && recState(c, rec) ? `<small class="pdesc">Expected level ${pct1(st.baseline)} (set by you)</small>` : rec && !recState(c, rec) ? `<small class="pdesc"><a href="#action/${encodeURIComponent(rid)}">${rec.optional && !promoted(c, rec) ? 'Optional · details' : 'Open action'} →</a></small>` : '';
          const note = x.issue ? `<small class="pdesc" style="color:var(--bad)">Dropped from ${pct1(x.base)} to ${pct1(x.issue.to)} on ${day(GF.END - (x.issue.since - 1) * GF.DAY)}</small>` : '';

    if (ep.discrepancy) {

      const O = periods(c).O, days = c.data.days.slice(c.data.n - O - Rn, c.data.n - O), WD = [0.86, 1.05, 1.06, 1.02, 1.0, 0.96, 0.88];

    o.lost = o.spend ? o.lost / o.spend : 0;

  function pageChannel(c, id) {

    const { R, O } = periods(c); const Rn = Math.min(R, c.data.n); const e = isEcom(c), rule = ruleOf(c);

      <section class="fox-hero" aria-label="Executive summary"><div class="id">${foxSvg('engineer', true)}<div><h1>${f.name}</h1><div class="role">${esc(f.role)}</div></div></div>

      <section class="sec" aria-label="Daily volume"><div class="sec-head"><div class="lead"><span class="eyebrow">Daily volume</span><span>Each source against its normal level: the same weekday over the last 4 weeks. The shaded band is the threshold; a day outside it opens a ticket, and so does a day with nothing at all. Change the threshold per source to match its sensitivity.</span></div></div>
        <div class="legend" style="margin:0 0 12px"><span><i style="background:var(--c)"></i>Daily volume</span><span><i style="background:repeating-linear-gradient(90deg,var(--faint) 0 4px,transparent 4px 8px)"></i>Normal level</span><span><i style="background:var(--c);opacity:.25;height:10px"></i>Threshold band</span><span><i style="background:var(--bad);width:10px;height:10px;border-radius:50%"></i>Outside the band</span></div>

  /* ---------- Real clients ---------- */

  /* ---------- Render ---------- */

`;

    glanceLoop(document.querySelector('.fox-hero svg.fox, .ph-fox svg.fox'), { first: 1500, rest: [1500, 3200] }); // the big fox looks around on its own
    const picked = document.querySelector('.foxcard[aria-pressed="true"] svg.fox'); // Overview: the selected fox comes alive
    if (picked) { if (state.bouncePick) bounce(picked); glanceLoop(picked, { first: state.bouncePick ? 260 : 600 }); }

  /* ---------- Fox motion: random idle glances, and a bounce on hover ----------
     Parallax sells the turn: eyes travel furthest, nose and muzzle less, the head turns a few degrees.
     Each cycle picks fresh random directions (never the same twice in a row), with random holds. */
  const DIRS = [[-2.6, 0.2], [2.6, 0.3], [0.3, -2.1], [0, 1.9], [-1.9, -1.8], [1.9, -1.8], [-1.4, 1.7], [1.5, 1.7]];
  const reduceMotion = () => !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const rnd = (a, b) => a + Math.random() * (b - a);
  function glanceLoop(svg, { first = 150, rest = [700, 1500] } = {}) {
    if (reduceMotion() || !svg || !svg.animate) return;
    const parts = { eyes: svg.querySelector('.eyes'), nose: svg.querySelector('.nose'), muz: svg.querySelector('.muz'), head: svg.querySelector('.head') };
    if (!parts.eyes || !parts.head) return;
    const token = {}; svg._glance = token;
    let last = -1;
    const pick = () => { let i; do { i = Math.floor(Math.random() * DIRS.length); } while (i === last); last = i; return DIRS[i]; };
    const cycle = delay => {
      if (svg._glance !== token || !svg.isConnected) return;
      const steps = [{ t: 0, d: [0, 0] }]; let t = delay;
      if (delay) steps.push({ t, d: [0, 0] });
      const n = 2 + Math.floor(Math.random() * 2);
      for (let k = 0; k < n; k++) {
        const d = pick();
        t += rnd(320, 480); steps.push({ t, d });
        t += rnd(700, 1600); steps.push({ t, d });
        if (k === n - 1 || Math.random() < 0.5) { t += rnd(320, 450); steps.push({ t, d: [0, 0] }); t += rnd(rest[0], rest[1]); steps.push({ t, d: [0, 0] }); }
      }
      const kf = f => steps.map(s => ({ offset: s.t / t, transform: f(s.d), easing: 'ease-in-out' }));
      const anims = [
        parts.eyes.animate(kf(([x, y]) => `translate(${x}px, ${y}px)`), t),
        parts.nose && parts.nose.animate(kf(([x, y]) => `translate(${x * 0.62}px, ${y * 0.55}px)`), t),
        parts.muz && parts.muz.animate(kf(([x, y]) => `translate(${x * 0.3}px, ${y * 0.27}px)`), t),
        parts.head.animate(kf(([x, y]) => `rotate(${x * 1.5}deg) translate(${x * 0.2}px, ${y * 0.2}px)`), t),
      ].filter(Boolean);
      svg._anims = anims;
      anims[0].onfinish = () => cycle(0);
    };
    cycle(first);
  }
  function stopGlances(svg) {

      an.cancel();

  }

    if (reduceMotion() || !svg || !svg.animate) return;

      { transform: 'translateY(0) scale(1, 1)' },
      { transform: 'translateY(-2px) scale(0.98, 1.03)', offset: 0.35 },
      { transform: 'translateY(0) scale(1.03, 0.97)', offset: 0.65 },
      { transform: 'translateY(0) scale(1, 1)' },

  let toastTimer, pendingGoto = null;
  function toast(msg, undo) {

  /* ---------- Events ---------- */
  document.addEventListener('click', ev => {

    const hrefNode = ev.target.closest('[data-href]');

    // Overview: clicking the background of "Your foxes" clears the fox filter
    if (state.nextFox && ev.target.closest('section[data-sec="foxes"]') && !ev.target.closest('a, button, .bubble, select')) { state.nextFox = null; render(); return; }
    const go = ev.target.closest('[data-goto]');
    if (go) {
      const id = go.dataset.goto; state.recFilter = 'all'; state.showDone = false; state.open.add(id); pendingGoto = id;
      if (location.hash === '#recs') { ev.preventDefault(); route(); }

    }
    const prow = ev.target.closest('tr[data-row]');
    if (prow && !ev.target.closest('button, a, select, input, label')) { location.hash = prow.dataset.row; return; }
    const row = ev.target.closest('.actlist li');
    const rowLink = row && row.querySelector('a.t[href^="#action/"]');
    const selecting = () => { const sl = window.getSelection && window.getSelection(); return !!(sl && !sl.isCollapsed && String(sl).trim()); };
    if (rowLink && !ev.target.closest('button, a, select, input, label')) { if (!selecting()) location.hash = rowLink.getAttribute('href'); return; }
    // Paid Media 2×2 area cards: the whole card opens that area on the channel page (inner chip links keep their own target)
    const agCard = ev.target.closest('.areagrid li'), agLink = agCard && agCard.querySelector('a.ag-link');
    if (agLink && (ev.target.closest('a.ag-link') || (!ev.target.closest('a, button, select, input, label, .area-checked') && !selecting()))) {
      ev.preventDefault(); state.scrollArea = agLink.dataset.area; const h = agLink.getAttribute('href');

    const b = ev.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'back') { if (history.length > 1) { ev.preventDefault(); history.back(); } return; }
    const c = ctx(); const id = b.dataset.id; const act = b.dataset.act; const now = Date.now();
    if (act === 'brief') { downloadBrief(c); return; }

    }
    if (act === 'doneopen-go') { state.doneOpen = true; render(); document.querySelector('section[aria-label="What your foxes have done"]')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    if (act === 'why') { // accordion: keep focus on the header button across the re-render
      state.whyOpen.has(id) ? state.whyOpen.delete(id) : state.whyOpen.add(id); render();
      [...document.querySelectorAll('[data-act="why"]')].find(x => x.dataset.id === id)?.focus({ preventScroll: true }); return;
    }
    if (act === 'done-open' || act === 'done-undo') {
      if (ledgerMode === 'readonly') { toast('You can view this ledger, but not change it.'); return; }
      const key = b.dataset.key;
      if (act === 'done-open') { openDone(c, key, b.dataset.rec); return; }
      const prev = c.status[key];
      saveLedger(c, key, null).then(ok => { render(); if (!ok) toast('Couldn’t undo. Please try again.'); else toast('Undone.', () => saveLedger(c, key, prev).then(() => render())); });
      return;
    }
    const rec = c.model.recs.find(x => x.id === id);
    const undoTo = () => { setStatus(c, id, null); render(); };
    if (['adopt', 'request', 'request-src', 'snooze', 'explevel', 'promote', 'unpromote', 'ctxopen', 'closeopen', 'dismiss', 'verify', 'undo'].includes(act) && ledgerMode === 'readonly') { toast('You can view this ledger, but not change it.'); return; }
    if (act === 'toggle') { state.open.has(id) ? state.open.delete(id) : state.open.add(id); }
    else if (act === 'ovfox') { state.ovFox = b.dataset.k; }
    else if (act === 'bubfox') { state.bubFox = b.dataset.k; }
    else if (act === 'resfox') { state.resFox = b.dataset.k; state.resSel = null; }
    else if (act === 'resmetric') { state.resMetric = b.dataset.k; }
    else if (act === 'resnav') { const rf = state.resFox || 'all'; const vis = rangeMarks(c).filter(r => rf === 'all' || r.fox === rf); const i = vis.findIndex(r => r.id === state.resSel) + +b.dataset.k; if (vis[i]) state.resSel = vis[i].id; }
    else if (act === 'adopt' && rec) { setStatus(c, id, ledgerEntry(c, rec, 'adopted')); toast('Added to the ledger. We’ll verify the change.', undoTo); }
    else if (act === 'request' && rec) { setStatus(c, id, ledgerEntry(c, rec, 'requested')); toast('Sent to the GrowthFox team and added to the ledger.', undoTo); }
    else if (act === 'promote' && rec) { setStatus(c, id, { status: 'promoted', at: now, by: uid }); toast('Added to All actions.', undoTo); }
    else if (act === 'unpromote') { setStatus(c, id, null); toast('Back in Optional improvements.'); }
    else if (act === 'datamore') { state.dataMore = !state.dataMore; }
    else if (act === 'ctxopen') { state.ctxOpen = id; state.closing = null; }
    else if (act === 'ctxcancel') { state.ctxOpen = null; }
    else if (act === 'closeopen') { state.closing = id; state.ctxOpen = null; }
    else if (act === 'closecancel') { state.closing = null; }
    else if (act === 'datasort') { state.dataSort = b.dataset.k; store.set('dataSort', state.dataSort); }
    else if (act === 'optmore') { state.optMore = !state.optMore; }
    else if (act === 'explevel' && rec) { const base = Math.floor(rec.compNow * 1000) / 1000; setStatus(c, id, ledgerEntry(c, rec, 'expected', { baseline: base, verifyDays: 0 })); toast(`Marked as expected at ${(base * 100).toFixed(1)}%. We’ll only flag it if it drops below.`, undoTo); }
    else if (act === 'snooze' && rec) { setStatus(c, id, ledgerEntry(c, rec, 'snoozed', { until: now + 7 * GF.DAY })); toast('Snoozed for 7 days.', undoTo); }
    else if (act === 'ask-dismiss') { state.dismissing = id; }
    else if (act === 'cancel-dismiss') { state.dismissing = null; }
    else if (act === 'dismiss' && rec) { setStatus(c, id, ledgerEntry(c, rec, 'dismissed', { reason: b.dataset.reason })); state.dismissing = null; toast('Dismissed. Your reason is logged in the ledger.', undoTo); }
    else if (act === 'nextfox') { state.nextFox = state.nextFox === b.dataset.k ? null : b.dataset.k; state.bouncePick = !!state.nextFox; }
    else if (act === 'bizm') { state.bizMetric = b.dataset.k; }
    else if (act === 'doneopen') { ev.preventDefault(); state.doneOpen = !state.doneOpen; }
    else if (act === 'logopen') { state.logOpen = !state.logOpen; }
    else if (act === 'ch-remove') {
      if (ledgerMode === 'readonly') { toast('You can view these changes, but not change them.'); return; }
      const cid = c.cfg.id, prevVal = chg(cid)[id];
      if (prevVal) { delete chg(cid)[id]; writeDoc(cid, 'changes', id, null); toast('Change removed.', () => { chg(cid)[id] = prevVal; writeDoc(cid, 'changes', id, prevVal); render(); }); }
    }
    else if (act === 'request-src') {
      const x = GF.ENGINEER[c.cfg.id].catalog.find(k => k.id === id);
      if (x) { const now2 = Date.now(); setStatus(c, 'src-' + id, { status: 'requested', at: now2, by: uid, title: `Connect ${x.name}`, fox: 'engineer', agent: 'connect', kind: 'connect', platform: x.name, owner: 'GrowthFox team', confidence: 'certain', unit: 'none', expectedPerDay: 0, spendChangedPerDay: 0, success: `${x.name} connected and syncing daily.`, verifyDays: 7, verifyDue: now2 + 7 * GF.DAY }); toast(`Sent to the GrowthFox team. ${x.name} is in the ledger.`); }
    }
    else if (act === 'verify') { if (c.cfg.real) return; simulateVerify(c, id); toast('Verification run (sample data).'); }
    else if (act === 'undo') { setStatus(c, id, null); }
    else if (act === 'filter') { state.recFilter = b.dataset.f; }
    else if (act === 'q-include' || act === 'q-exclude') { setDecision(c, id, act === 'q-include' ? 'include' : 'exclude'); toast(act === 'q-include' ? 'Included. The data is back in the dashboard.' : 'Kept out of the dashboard.'); }
    else if (act === 'q-undo') { setDecision(c, id, null); }
    render();
  });
  // Log a change: keep the draft while typing (a shared-store update re-renders the page), save on submit
  document.addEventListener('input', ev => {
    const f = ev.target.form; if (!f || f.dataset.form !== 'change') return;
    state.chDraft = Object.fromEntries(new FormData(f));
  });
  document.addEventListener('submit', ev => {
    const tf = ev.target;
    if (tf.dataset && (tf.dataset.form === 'ctxnote' || tf.dataset.form === 'closeticket')) {
      ev.preventDefault();
      if (ledgerMode === 'readonly') { toast('You can view this ledger, but not change it.'); return; }
      const c = ctx(), id = tf.dataset.id, rec = c.model.recs.find(x => x.id === id), v = Object.fromEntries(new FormData(tf));
      if (!rec) return;
      if (tf.dataset.form === 'ctxnote') {
        const text = (v.text || '').trim(); if (!text) return;
        const prev = c.status['note-' + id], notes = ((prev && prev.notes) || []).concat([{ text: text.slice(0, 200), at: Date.now(), by: uid }]);
        setStatus(c, 'note-' + id, { notes }); state.ctxOpen = null; toast('Context added to the ticket.'); render(); return;
      }
      const reason = (v.reason || '').trim(); if (!reason) { toast('Add a reason.'); return; }
      const cid = c.cfg.id, chId = v.log ? 'ch' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) : null;
      if (chId) { const val = { at: dayStart(rec.startAt) + 12 * 3600e3, title: reason.slice(0, 90), cat: CH_CAT[v.cat] ? v.cat : 'other', ch: '', by: uid, loggedAt: Date.now(), fromTicket: id }; chg(cid)[chId] = val; writeDoc(cid, 'changes', chId, val); }
      setStatus(c, id, ledgerEntry(c, rec, 'closed', { reason: reason.slice(0, 120), logged: !!chId, verifyDays: 0 }));
      state.closing = null;
      toast(chId ? 'Ticket closed. The change is on the Executive chart.' : 'Ticket closed.', () => { setStatus(c, id, null); if (chId) { delete chg(cid)[chId]; writeDoc(cid, 'changes', chId, null); } render(); });
      render(); return;
    }
    const f = ev.target; if (!f.dataset || f.dataset.form !== 'change') return;
    ev.preventDefault();
    if (ledgerMode === 'readonly') { toast('You can view these changes, but not add to them.'); return; }
    const v = Object.fromEntries(new FormData(f));
    const title = (v.title || '').trim();
    if (!title || !v.date) { toast('Add a date and what changed.'); return; }
    const at = new Date(v.date + 'T12:00:00').getTime();
    if (!isFinite(at)) { toast('That date doesn’t look right.'); return; }
    const c = ctx(), cid = c.cfg.id, id = 'ch' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const val = { at, title: title.slice(0, 90), cat: CH_CAT[v.cat] ? v.cat : 'other', ch: CH_AFFECTS.includes(v.ch) ? v.ch : '', by: uid, loggedAt: Date.now() };
    chg(cid)[id] = val; writeDoc(cid, 'changes', id, val);
    state.chDraft = null;
    const R0 = chgRange(c), i = dayIdx(c, dayStart(at)), inRange = i >= R0.from && i <= R0.to;
    toast(inRange ? 'Logged. It’s on the Executive chart.' : 'Logged. Widen the date range to see it on the chart.', () => { delete chg(cid)[id]; writeDoc(cid, 'changes', id, null); render(); });
    render();
  });
  document.addEventListener('change', ev => {
    if (ev.target.id === 'client') { state.clientId = ev.target.value; store.set('client', state.clientId); state.open.clear(); state.dismissing = null; state.dataMore = state.optMore = false; render(); }
    if (ev.target.id === 'rule') { state.rule = ev.target.value; render(); }
    if (ev.target.dataset && ev.target.dataset.thr) {
      if (ledgerMode === 'readonly') { toast('You can view these settings, but not change them.'); render(); return; }
      const c = ctx(); setStatus(c, 'thr-' + ev.target.dataset.thr, { value: +ev.target.value, at: Date.now(), by: uid }); render();
      toast('Threshold saved. Tickets now follow it.');
    }
    if (ev.target.id === 'sort') { state.recSort = ev.target.value; render(); }
  });
  function route() {
    let [h, sub, sub2] = location.hash.replace('#', '').split('/');
    if (h === 'tracking') { h = 'analytics'; sub = null; history.replaceState(null, '', '#analytics'); } // Tracking health now lives on the Data Fox page
    state.page = PAGES.includes(h) ? h : 'overview';
    state.ep = state.page === 'analytics' && sub ? sub : null;
    state.ch = state.page === 'paid' && sub ? sub : null;
    state.actId = state.page === 'action' && sub ? decodeURIComponent(sub) : null;
    state.param = state.page === 'param' && sub && sub2 ? { ep: sub, key: decodeURIComponent(sub2) } : null;
    render();
    const el = pendingGoto && document.getElementById('rec-' + pendingGoto);
    pendingGoto = null;
    const areaEl = state.scrollArea && document.getElementById('area-' + state.scrollArea); state.scrollArea = null;
    if (el) el.scrollIntoView({ block: 'start' }); else if (areaEl) areaEl.scrollIntoView({ block: 'start' }); else window.scrollTo({ top: 0 });
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
